[project]
name = "ausleihe-ausgabe"
version = "0.1.0"
description = "IServ Ausleihe-Ausgabe — Handy-Scanner für Stapelerstellung und Live-Ausgabe (Seminarfachprojekt)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "playwright>=1.50",
    "python-dotenv>=1.0",
    "qrcode[pil]>=8.0",
    "cryptography>=42",
    "pymupdf>=1.24",
    "iserv-ausleihe-api",
]

[dependency-groups]
# pytest-timeout (Begruendung s. sba-dashboard/pyproject.toml): die Suite
# startet Threads und multiprocessing-"spawn"-Kinder — ein hängender Lauf
# endet ohne Zeitgrenze nie von selbst und verbraucht in der CI die vollen
# 30 Minuten ohne eine Zeile Ausgabe.
dev = ["pytest>=8.0", "pytest-timeout>=2.3,<3", "pytest-cov>=5.0", "httpx2>=0.28",
       "ruff>=0.8,<1"]

[tool.uv.sources]
iserv-ausleihe-api = { path = "../ausleihe-api", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# --timeout-method=thread wie im Dashboard: "signal" braeuchte SIGALRM und
# ist bei Threads/Multiprocessing-Kindern die falsche Wahl; die thread-Methode
# gibt beim Zuschlagen den Stack jedes Threads aus — genau der Befund, den man
# bei einem verklemmten Schloss sonst raten muesste. 300s: die volle Suite
# (635 Tests) braucht lokal ~40s, ein einzelner Test Sekunden.
addopts = "-q --timeout=300 --timeout-method=thread --cov=server --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["automation/out", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # SIM105: `except Exception: pass` -> `contextlib.suppress(Exception)` is
    # stylistic and touches ~26 call sites, several inside the IServ read-path
    # and Playwright worker where the exact except-block shape is deliberate
    # (see `except Exception:  # noqa: BLE001` convention below). Behavior is
    # equivalent either way, but rewriting all of them is out of scope for a
    # zero-risk lint bootstrap; revisit in a later refactor wave.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# E501: 10 Zeilen in den Spike-/E2E-Skripten sind Playwright-JS/CSS-Selektoren
# bzw. lange deutsche Log-Texte, die sich nicht sinnvoll umbrechen lassen.
# server/ und tests/ halten die 100-Zeichen-Grenze vollständig ein.
"automation/*" = ["E501"]
